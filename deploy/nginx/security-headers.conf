# Security headers for the portfolio.
# Install as /etc/nginx/snippets/nebras-security-headers.conf
# Keep in sync with SECURITY in scripts/serve-out.mjs (used by `npm run preview`).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Only this site's own files may load. 'unsafe-inline' is needed because the
# Next.js static export inlines its page data in <script> tags, and animations
# set inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# Turn this on only after HTTPS works (README, step 7). Browsers remember it for a year.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
