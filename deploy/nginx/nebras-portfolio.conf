# nginx server block for the portfolio (static files in /out).
#
# Install (see README, "Deploy to your VPS"):
#   sudo cp nebras-portfolio.conf /etc/nginx/sites-available/nebras-portfolio
#   sudo cp security-headers.conf /etc/nginx/snippets/nebras-security-headers.conf
#   sudo ln -s /etc/nginx/sites-available/nebras-portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before installing: replace example.com with your domain (2 places below)
# and check that `root` matches DEPLOY_PATH in your .env.deploy + /current.
# HTTPS: run certbot afterwards. It edits this file to add port 443 and the
# http -> https redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/nebras-portfolio/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compress text. Images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml image/x-icon;

    # Note: add_header inside a location replaces the server-level ones,
    # so every location includes the security headers again.
    include snippets/nebras-security-headers.conf;

    # Build files have a content hash in their name: cache for a year.
    location /_next/static/ {
        include snippets/nebras-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, icons and fonts: cache for a week.
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?)$ {
        include snippets/nebras-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Open Graph images and icons are PNG files without an extension.
    location ~ /(?:opengraph-image|apple-icon|icon)$ {
        include snippets/nebras-security-headers.conf;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Pages and route data: always revalidate, so a new deploy shows up at once.
    location / {
        include snippets/nebras-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Block hidden files, but let Let's Encrypt reach /.well-known/.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        include snippets/nebras-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
